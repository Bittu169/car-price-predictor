<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <title>Car Price Predictor</title>
</head>

<body class="bg-dark">
  <div class="container mt-50">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card">

          <!-- Header -->
          <div class="card-header text-center">
            <h1>🚗 Car Price Predictor</h1>
            <p class="text-light mb-0">Predict resale value instantly</p>
          </div>

          <!-- Body -->
          <div class="card-body">
            <form method="post" onsubmit="return send_data(event)">

              <!-- Company -->
              <div class="form-group">
                <label>Select Company</label>
                <select class="form-control" id="company" name="company" required onchange="load_car_model(this)">
                  <option value="">-- Select Company --</option>
                  {% for com in companies %}
                    <option value="{{ com }}">{{ com }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Model -->
              <div class="form-group">
                <label>Select Model</label>
                <select class="form-control" id="car_model" name="car_model" required>
                  <option value="">-- Select Company First --</option>
                </select>
              </div>

              <!-- Year -->
              <div class="form-group">
                <label>Year of Purchase</label>
                <select class="form-control" id="year" name="year" required>
                  {% for year in years %}
                    <option value="{{ year }}">{{ year }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Fuel -->
              <div class="form-group">
                <label>Fuel Type</label>
                <select class="form-control" id="fuel_type" name="fuel_type" required>
                  {% for ft in fuel_type %}
                    <option value="{{ ft }}">{{ ft }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Kilometers -->
              <div class="form-group">
                <label>Kilometers Driven</label>
                <input
                  type="number"
                  class="form-control"
                  id="kilo_driven"
                  name="kilo_driven"
                  placeholder="e.g. 45000"
                  min="500"
                  required
                >
              </div>

              <!-- Button -->
              <button type="submit" class="btn btn-primary btn-block mt-3">
                Predict Price
              </button>
            </form>

            <!-- Prediction Output -->
            <div class="text-center mt-4">
              <span id="prediction"></span>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Logic -->
  <script>
    const carModelData = {{ company_to_models|tojson }};

    function load_car_model(companySelect) {
      const selectedCompany = companySelect.value;
      const carModelSelect = document.getElementById("car_model");
      carModelSelect.innerHTML = "";

      if (selectedCompany in carModelData) {
        carModelData[selectedCompany].forEach(model => {
          const option = document.createElement("option");
          option.value = model;
          option.text = model;
          carModelSelect.appendChild(option);
        });
      } else {
        const option = document.createElement("option");
        option.text = "-- No Models Available --";
        carModelSelect.appendChild(option);
      }
    }

    function send_data(event) {
      event.preventDefault();

      const form = document.querySelector("form");
      const fd = new FormData(form);
      const xhr = new XMLHttpRequest();

      xhr.open("POST", "/predict", true);

      document.getElementById("prediction").innerHTML =
        "⏳ Predicting price...";

      xhr.onreadystatechange = function () {
        if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
          document.getElementById("prediction").innerHTML =
            "💰 Estimated Price: ₹ " + xhr.responseText;
        }
      };

      xhr.send(fd);
      return false;
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>

</body>
</html>
